  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهارة التقليد - التصفيق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-btn:#5AC8FA;
    --sky-btn-deep:#2E9FD6;
    --leaf:#4CAF7D;
    --plum:#3A2E5C;
    --plum-soft:#6B5F8C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 8%, #fff7e0 0%, transparent 40%),
      radial-gradient(circle at 92% 88%, #d9f3e6 0%, transparent 45%),
      linear-gradient(180deg, #EAF6FB 0%, #D6EEF9 100%);
    font-family:'Cairo', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:14px 10px 20px;
  }
  .shell{ width:100%; max-width:760px; }

  /* ===== progress / step bar ===== */
  .stepbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#fff;
    border-radius:20px;
    padding:14px 18px;
    margin-bottom:14px;
    box-shadow:0 8px 20px rgba(58,46,92,.08);
  }
  .step{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    cursor:pointer; flex:1;
  }
  .step-circle{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; color:#fff;
    background:#D9D2E8;
    transition: background .25s ease, transform .2s ease;
  }
  .step-label{ font-size:12px; font-weight:700; color:var(--plum-soft); }
  .step.done .step-circle{ background:var(--leaf); }
  .step.current .step-circle{ background:var(--sky-btn-deep); transform:scale(1.08); }
  .step.current .step-label{ color:var(--sky-btn-deep); }
  .step-line{ flex:0.6; height:3px; background:#E4DEF2; margin-top:-24px; }

  /* ===== page frames ===== */
  .pages{ position:relative; width:100%; }
  .pages iframe{
    width:100%;
    border:0;
    border-radius:24px;
    display:none;
    background:transparent;
    min-height:80vh;
  }
  .pages iframe.active{ display:block; }
</style>
</head>
<body>
<div class="shell">

  <div class="stepbar" id="stepbar">
    <div class="step" data-tab="1">
      <div class="step-circle">١</div>
      <div class="step-label">المعلومات والفيديو</div>
    </div>
    <div class="step-line"></div>
    <div class="step" data-tab="2">
      <div class="step-circle">٢</div>
      <div class="step-label">النشاط</div>
    </div>
    <div class="step-line"></div>
    <div class="step" data-tab="3">
      <div class="step-circle">٣</div>
      <div class="step-label">التقييم</div>
    </div>
  </div>

  <div class="pages">
    <iframe id="frame1"></iframe>
    <iframe id="frame2"></iframe>
    <iframe id="frame3"></iframe>
  </div>

</div>

<template id="tpl1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF6FB;
    --sky-deep:#D6EEF9;
    --orange:#FF9E44;
    --orange-deep:#F07C1E;
    --mango:#FFD166;
    --leaf:#4CAF7D;
    --leaf-deep:#379563;
    --plum:#3A2E5C;
    --plum-soft:#6B5F8C;
    --white:#FFFFFF;
    --red:#FF6F6F;
    --red-deep:#E24C4C;
    --sky-btn:#5AC8FA;
    --sky-btn-deep:#2E9FD6;
    --amber:#FFB84D;
    --amber-deep:#E0902C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 8%, #fff7e0 0%, transparent 40%),
      radial-gradient(circle at 92% 88%, #d9f3e6 0%, transparent 45%),
      linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 100%);
    font-family:'Cairo', sans-serif;
    color:var(--plum);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 14px 50px;
  }
  h1,h2,h3{font-family:'Baloo Bhaijaan 2', sans-serif; margin:0;}

  .doc{
    width:100%;
    max-width:720px;
    background:var(--white);
    border-radius:28px;
    padding:30px 26px 34px;
    box-shadow:0 14px 0 rgba(58,46,92,.08), 0 20px 40px rgba(58,46,92,.10);
  }

  .eyebrow{
    display:inline-block;
    font-weight:700;
    color:var(--sky-btn-deep);
    background:#E4F6FF;
    padding:6px 16px;
    border-radius:999px;
    font-size:13.5px;
    margin-bottom:12px;
  }
  .doc-title{ font-size:26px; font-weight:800; margin-bottom:10px; line-height:1.5; }
  .doc-lead{
    font-size:16px;
    color:var(--plum-soft);
    line-height:1.9;
    margin-bottom:26px;
  }

  h2.section-title{
    font-size:20px;
    font-weight:800;
    color:var(--plum);
    margin:34px 0 16px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  h2.section-title .num{
    flex-shrink:0;
    width:32px; height:32px;
    border-radius:10px;
    background:linear-gradient(180deg, #7ED9F7, var(--sky-btn));
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    font-weight:800;
  }

  .benefit-list{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:6px;
  }
  .benefit-item{
    display:flex;
    gap:12px;
    align-items:flex-start;
    background:#F7F5FF;
    border-radius:16px;
    padding:14px 16px;
  }
  .benefit-icon{
    flex-shrink:0;
    width:38px; height:38px;
    border-radius:12px;
    background:linear-gradient(180deg, #7ED9F7, var(--sky-btn));
    display:flex; align-items:center; justify-content:center;
    font-size:19px;
  }
  .benefit-text strong{ display:block; font-size:15px; color:var(--plum); margin-bottom:3px; }
  .benefit-text span{ font-size:14px; color:var(--plum-soft); line-height:1.75; }

  .prep-box{
    background:#FFF7E9;
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:18px;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .prep-box .tag{
    flex-shrink:0;
    background:var(--mango);
    color:var(--plum);
    font-weight:800;
    padding:3px 12px;
    border-radius:999px;
    font-size:12.5px;
  }
  .prep-box p{ margin:0; font-size:14px; color:var(--plum-soft); line-height:1.85; }

  /* prompt ladder */
  .ladder{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-bottom:8px;
  }
  .step-card{
    display:flex;
    gap:14px;
    align-items:flex-start;
    border-radius:18px;
    padding:16px 18px;
    border:2px solid #EEE9FA;
    position:relative;
  }
  .step-badge{
    flex-shrink:0;
    width:42px; height:42px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:800;
    font-size:17px;
    color:#fff;
  }
  .step1 .step-badge{ background:linear-gradient(180deg, #FF8A8A, var(--red-deep)); }
  .step2 .step-badge{ background:linear-gradient(180deg, #FFB07A, var(--orange-deep)); }
  .step3 .step-badge{ background:linear-gradient(180deg, #FFD08A, var(--amber)); }
  .step4 .step-badge{ background:linear-gradient(180deg, #7ED9F7, var(--sky-btn)); }
  .step5 .step-badge{ background:linear-gradient(180deg, #7EE0A8, var(--leaf)); }

  .step-body strong{ display:block; font-size:15.5px; color:var(--plum); margin-bottom:4px; }
  .step-body span{ font-size:14px; color:var(--plum-soft); line-height:1.8; display:block; }
  .step-body .example{
    margin-top:6px;
    font-size:13px;
    color:var(--plum-soft);
    background:#F7F5FF;
    border-radius:10px;
    padding:8px 12px;
    display:inline-block;
  }

  .arrow-down{
    text-align:center;
    color:var(--plum-soft);
    font-size:20px;
    margin:-4px 0;
  }

  .rule-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:14px 0 6px;
  }
  .rule-item{
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:14.5px;
    color:var(--plum-soft);
    line-height:1.8;
  }
  .rule-item .check{
    flex-shrink:0;
    color:var(--leaf-deep);
    font-weight:800;
  }

  .reinforce-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:16px 0 6px;
  }
  .reinforce-card{
    background:#F0FBF4;
    border-radius:16px;
    padding:14px 16px;
    text-align:right;
  }
  .reinforce-card strong{ display:block; font-size:14.5px; color:var(--leaf-deep); margin-bottom:5px; }
  .reinforce-card span{ font-size:13px; color:var(--plum-soft); line-height:1.75; }

  .caution-box{
    background:#FFF1F0;
    border-radius:16px;
    padding:16px 18px;
    margin-top:20px;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .caution-box .tag{
    flex-shrink:0;
    background:var(--red);
    color:#fff;
    font-weight:800;
    padding:3px 12px;
    border-radius:999px;
    font-size:12.5px;
  }
  .caution-box p{ margin:0; font-size:14px; color:var(--plum-soft); line-height:1.85; }

  .closing{
    margin-top:28px;
    background:linear-gradient(135deg, #FFF7E9, #EAF6FB);
    border-radius:18px;
    padding:20px 20px;
    text-align:center;
  }
  .closing strong{ display:block; font-size:16.5px; color:var(--plum); margin-bottom:6px; }
  .closing span{ font-size:14px; color:var(--plum-soft); line-height:1.85; }

  @media (max-width:520px){
    .reinforce-grid{ grid-template-columns:1fr; }
    .doc{ padding:22px 18px 28px; }
  }

  /* ===== video CTA section ===== */
  .video-cta{ margin-top:32px; text-align:center; }
  .video-btn{
    background:linear-gradient(180deg, #7ED9F7, var(--sky-btn));
    color:#fff; font-family:'Baloo Bhaijaan 2', sans-serif; font-weight:800;
    font-size:17px; padding:15px 34px; border:none; border-radius:100px;
    cursor:pointer; box-shadow:0 10px 22px rgba(46,159,214,.35);
    display:inline-flex; align-items:center; gap:9px;
    transition: transform .15s ease;
  }
  .video-btn:active{ transform:scale(.96); }
  .video-section{ display:none; margin-top:22px; }
  .video-section.show{ display:block; animation:fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .video-frame-wrap{
    position:relative; width:100%; padding-bottom:56.25%;
    border-radius:18px; overflow:hidden;
    box-shadow:0 10px 24px rgba(58,46,92,.15);
  }
  .video-frame-wrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .video-link-row{
    display:flex; flex-wrap:wrap; align-items:center; gap:6px;
    margin-top:12px; padding:10px 14px; background:#E4F6FF; border-radius:12px;
    font-size:13.5px; color:var(--plum-soft); direction:ltr; justify-content:center;
  }
  .video-link-row span{ direction:rtl; color:var(--plum); font-weight:700; }
  .video-link-row a{ color:var(--sky-btn-deep); font-weight:700; word-break:break-all; text-decoration:underline; }
  .tip-list{ display:flex; flex-direction:column; gap:12px; margin-top:18px; }
  .tip-item{ display:flex; align-items:flex-start; gap:12px; background:#F7F5FF; border-radius:16px; padding:14px 16px; }
  .tip-icon{
    flex-shrink:0; width:38px; height:38px; border-radius:12px;
    background:linear-gradient(180deg, #7ED9F7, var(--sky-btn));
    display:flex; align-items:center; justify-content:center; font-size:19px;
  }
  .tip-text{ font-size:14px; color:var(--plum-soft); line-height:1.8; padding-top:6px; }

  /* ===== page nav ===== */
  .page-nav{ margin-top:30px; display:flex; justify-content:center; }
  .nav-btn{
    font-family:'Baloo Bhaijaan 2', sans-serif; font-weight:800; font-size:15px;
    padding:13px 30px; border-radius:100px; border:none; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px; transition: transform .15s ease;
  }
  .nav-btn:active{ transform:scale(.96); }
  .nav-btn.next{ background:var(--leaf); color:#fff; box-shadow:0 8px 18px rgba(76,175,125,.35); }
</style>


<div class="doc">
  <span class="eyebrow">دليل للأهل</span>
  <h1 class="doc-title">أهمية مهارة التقليد (زي ضع يدك على رأسك) وطريقة تعليمها للطفل خطوة بخطوة</h1>
  <p class="doc-lead">التقليد من أبسط المهارات وأهمّها في نفس الوقت. تعلّم حركة بسيطة زي ضع يدك على رأسك مش بس "لعبة" — هو تمرين خفي على الانتباه، التواصل، والاستعداد للكلام لاحقًا. هذا الدليل يشرح ليش التقليد مهم، وكيف تطبّقون النشاط بمساعدة كاملة بالبداية، ثم تقللون المساعدة تدريجيًا لحد ما يصير الطفل مستقل، مع أهمية التعزيز المناسب في كل خطوة.</p>

  <!-- ===== SECTION 1: WHY IMITATION MATTERS ===== -->
  <h2 class="section-title"><span class="num">١</span> ليش التقليد مهم لطفلكم؟</h2>
  <div class="benefit-list">
    <div class="benefit-item">
      <div class="benefit-icon">🧩</div>
      <div class="benefit-text">
        <strong>حجر الأساس للتعلّم الاجتماعي</strong>
        <span>الطفل يتعلم أغلب مهاراته (الكلام، اللعب، التفاعل) بالبداية عن طريق تقليد من حوله، قبل ما يقدر يبتكر بنفسه.</span>
      </div>
    </div>
    <div class="benefit-item">
      <div class="benefit-icon">👀</div>
      <div class="benefit-text">
        <strong>يبني التواصل البصري والانتباه المشترك</strong>
        <span>عشان يقلّد حركة زي ضع يدك على رأسك، لازم ينتبه لوجه ويدين الشخص المقابل له، وهذا يدرّبه على التركيز مع الآخرين.</span>
      </div>
    </div>
    <div class="benefit-item">
      <div class="benefit-icon">🗣️</div>
      <div class="benefit-text">
        <strong>يمهّد للكلام</strong>
        <span>تقليد الحركات البسيطة (تصفيق، تلويح، إشارة) خطوة قبل تقليد الأصوات والكلمات؛ الطفل يلي يقدر يقلّد حركة غالبًا بيوصل أسرع لتقليد كلمة.</span>
      </div>
    </div>
    <div class="benefit-item">
      <div class="benefit-icon">🌟</div>
      <div class="benefit-text">
        <strong>يعزّز الثقة والمشاركة</strong>
        <span>كل مرة يقلّد فيها بنجاح ويشوف ردة فعل إيجابية، يحس بإنجاز، وهذا يشجعه يكرر ويجرب أكثر.</span>
      </div>
    </div>
    <div class="benefit-item">
      <div class="benefit-icon">🤝</div>
      <div class="benefit-text">
        <strong>أساس للعب التبادلي</strong>
        <span>الألعاب الاجتماعية البسيطة (مثل "بيني بيني" أو الاستغماية) مبنية على تقليد وانتظار الدور، وده يهيّئه للعب مع أطفال ثانيين لاحقًا.</span>
      </div>
    </div>
    <div class="benefit-item">
      <div class="benefit-icon">🔁</div>
      <div class="benefit-text">
        <strong>سهلة التدريب واليومية</strong>
        <span>عكس المهارات المعقدة، حركات زي ضع يدك على رأسك تقدرون تكرروها بسهولة في أي وقت (أغنية، لعبة، وداع)، فتتكرر التجربة بشكل طبيعي بدون ضغط.</span>
      </div>
    </div>
  </div>

  <!-- ===== SECTION 2: HOW TO APPLY ===== -->
  <h2 class="section-title"><span class="num">٢</span> طريقة تطبيق النشاط: من المساعدة الكاملة إلى الاستقلالية</h2>

  <div class="prep-box">
    <span class="tag">قبل البدء</span>
    <p>اجلسوا وجهًا لوجه مع الطفل بمستوى نظره، اختاروا وقت هادئ يكون فيه منتبه (مو متعب أو جوعان)، وتأكدوا من وجود تواصل بصري بسيط قبل إعطاء أي تلميح.</p>
  </div>

  <div class="ladder">
    <div class="step-card step1">
      <div class="step-badge">١</div>
      <div class="step-body">
        <strong>المساعدة الكاملة (مساعدة جسدية كاملة)</strong>
        <span>تمسكون يدي الطفل بلطف وتصفّقون معه فعليًا وأنتم تقولون "صفّق!". هذا المستوى يضمن نجاح الطفل ١٠٠٪، وهو نقطة البداية الآمنة.</span>
        <span class="example">مثال: "يلا نصفّق سوا! 👏" (وأنتم تحركون يديه)</span>
      </div>
    </div>

    <div class="arrow-down">⬇</div>

    <div class="step-card step2">
      <div class="step-badge">٢</div>
      <div class="step-body">
        <strong>المساعدة الجزئية (لمسة خفيفة)</strong>
        <span>تلمسون يديه بلطف بدون ما تحركوها بالكامل — فقط توجيه بسيط، وتنتظرون هو يكمل الحركة بنفسه.</span>
      </div>
    </div>

    <div class="arrow-down">⬇</div>

    <div class="step-card step3">
      <div class="step-badge">٣</div>
      <div class="step-body">
        <strong>النموذج البصري (تقليد بدون لمس)</strong>
        <span>تصفّقون أنتم أمامه بوضوح بدون أي لمس له، وتنتظرون يلاحظ ويقلّد الحركة بنفسه.</span>
      </div>
    </div>

    <div class="arrow-down">⬇</div>

    <div class="step-card step4">
      <div class="step-badge">٤</div>
      <div class="step-body">
        <strong>التلميح اللفظي فقط</strong>
        <span>تقولون "صفّق!" بدون ما تصفّقوا أنتم، وتعطونه وقت (٣-٥ ثواني) عشان يستجيب لوحده.</span>
      </div>
    </div>

    <div class="arrow-down">⬇</div>

    <div class="step-card step5">
      <div class="step-badge">٥</div>
      <div class="step-body">
        <strong>الاستقلالية الكاملة</strong>
        <span>يصفّق من تلقاء نفسه في الموقف المناسب (أغنية، فرح، نجاح) بدون أي تلميح منكم — هذا الهدف النهائي.</span>
      </div>
    </div>
  </div>

  <h2 class="section-title"><span class="num">٣</span> كيف تنتقلون بين المستويات (تقليل المساعدة تدريجيًا)</h2>
  <div class="rule-list">
    <div class="rule-item"><span class="check">✓</span><span>ابدأوا دايمًا بالمستوى اللي يضمن نجاح الطفل، حتى لو كان مساعدة كاملة — النجاح المتكرر هو اللي يبني الثقة.</span></div>

  var TRIALS_PER_BLOCK = 5;

  var specHot = document.getElementById('specHot');
  var gameArea = document.getElementById('gameArea');
  var levelBadge = document.getElementById('levelBadge');
  var trialDots = document.getElementById('trialDots');
  var chairZone = document.getElementById('chairZone');
  var chairResult = document.getElementById('chairResult');
  var choicesEl = document.getElementById('choices');
  var msg = document.getElementById('msg');
  var nextLevelBtn = document.getElementById('nextLevelBtn');
  var finalCard = document.getElementById('finalCard');
  var resetBtn = document.getElementById('resetBtn');
  var promptSound = document.getElementById('promptSound');

  var level = 1;
  var trial = 0;
  var results = [];
  var answered = false;

  function setMsg(text, cls){
    msg.textContent = text;
    msg.className = 'msg' + (cls ? (' ' + cls) : '');
  }

  function levelPool(){
    return level === 1 ? ['sandwich','head'] : ['sandwich','belly','head'];
  }

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function renderDots(){
    trialDots.innerHTML = '';
    for (var i = 0; i < TRIALS_PER_BLOCK; i++){
      var d = document.createElement('div');
      d.className = 'trial-dot';
      if (results[i] === 'correct') d.classList.add('correct');
      else if (results[i] === 'incorrect') d.classList.add('incorrect');
      if (i === trial) d.classList.add('current');
      d.textContent = results[i] === 'correct' ? '✓' : (results[i] === 'incorrect' ? '✗' : '');
      trialDots.appendChild(d);
    }
    levelBadge.textContent = 'المستوى ' + (level === 1 ? '١' : '٢');
  }

  function makeDraggable(el, isCorrect){
    el.style.touchAction = 'none';
    el.addEventListener('pointerdown', function(e){
      if (answered) return;
      e.preventDefault();
      var rect = el.getBoundingClientRect();
      var offsetX = e.clientX - rect.left;
      var offsetY = e.clientY - rect.top;
      var parent = el.parentElement;
      var placeholder = document.createElement('div');
      placeholder.className = 'choice-placeholder';
      placeholder.style.width = rect.width + 'px';
      placeholder.style.height = rect.height + 'px';
      parent.insertBefore(placeholder, el);

      document.body.appendChild(el);
      el.style.position = 'fixed';
      el.style.zIndex = 1000;
      el.style.width = rect.width + 'px';
      el.style.height = rect.height + 'px';
      el.style.left = rect.left + 'px';
      el.style.top = rect.top + 'px';
      el.classList.add('dragging');

      function move(ev){
        el.style.left = (ev.clientX - offsetX) + 'px';
        el.style.top = (ev.clientY - offsetY) + 'px';
      }

      function returnEl(){
        el.classList.remove('dragging');
        el.style.position = '';
        el.style.left = '';
        el.style.top = '';
        el.style.width = '';
        el.style.height = '';
        el.style.zIndex = '';
        parent.insertBefore(el, placeholder);
        placeholder.remove();
      }

      function up(ev){
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);

        var dropRect = chairZone.getBoundingClientRect();
        var elRect = el.getBoundingClientRect();
        var cx = elRect.left + elRect.width / 2;
        var cy = elRect.top + elRect.height / 2;
        var hit = cx > dropRect.left && cx < dropRect.right && cy > dropRect.top && cy < dropRect.bottom;

        if (!hit){ returnEl(); return; }
        if (answered){ returnEl(); return; }
        answered = true;

        var allImgs = choicesEl.querySelectorAll('.choice-img');
        allImgs.forEach(function(img){ img.classList.add('disabled'); });

        if (isCorrect){
          returnEl();
          el.classList.add('disabled');
          chairResult.classList.add('show');
          chairZone.classList.add('filled');
          results[trial] = 'correct';
          setMsg('أحسنت! 🎉', 'success');
        } else {
          returnEl();
          results[trial] = 'incorrect';
          setMsg('حاول مرة أخرى في المرة القادمة! ❌', 'error');
        }

        renderDots();

        var delay = isCorrect ? 3000 : 1100;
        setTimeout(nextTrial, delay);
      }

      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
  }

  function renderChoices(){
    choicesEl.innerHTML = '';
    var pool = shuffle(levelPool());
    pool.forEach(function(key){
      var info = IMAGES[key];
      var card = document.createElement('div');
      card.className = 'choice-card';
      var img = document.createElement('img');
      img.className = 'choice-img';
      img.src = info.src;
      img.alt = info.label;
      var label = document.createElement('div');
      label.className = 'choice-label';
      label.textContent = info.label;
      card.appendChild(img);
      card.appendChild(label);
      choicesEl.appendChild(card);
      makeDraggable(img, info.correct);
    });
  }

  function startTrial(){
    answered = false;
    chairResult.classList.remove('show');
    chairZone.classList.remove('filled');
    setMsg('', '');
    renderChoices();
    renderDots();
  }

  function nextTrial(){
    trial++;
    if (trial < TRIALS_PER_BLOCK){
      startTrial();
      return;
    }
    var correctCount = results.filter(function(r){ return r === 'correct'; }).length;
    if (correctCount === TRIALS_PER_BLOCK){
      setMsg('ممتاز! أكملت ' + TRIALS_PER_BLOCK + ' من ' + TRIALS_PER_BLOCK + ' بشكل صحيح 🌟', 'success');
      if (level === 1){
        nextLevelBtn.classList.add('show');
      } else {
        gameArea.classList.remove('show');
        gameArea.style.display = 'none';
        finalCard.classList.add('show');
      }
    } else {
      setMsg('لم تكتمل المحاولات بنجاح، سنعيد المحاولة من البداية 🔁', 'info');
      setTimeout(function(){
        trial = 0;
        results = [];
        startTrial();
      }, 1600);
    }
  }

  specHot.addEventListener('click', function(){
    try{ promptSound.currentTime = 0; promptSound.play(); }catch(e){}
    specHot.classList.add('active');
    if (!gameArea.classList.contains('show')){
      gameArea.classList.add('show');
      gameArea.style.display = 'block';
      startTrial();
    }
  });

  nextLevelBtn.addEventListener('click', function(){
    level = 2;
    trial = 0;
    results = [];
    nextLevelBtn.classList.remove('show');
    startTrial();
    window.scrollTo({top:0, behavior:'smooth'});
  });

  function resetGame(){
    level = 1;
    trial = 0;
    results = [];
    answered = false;

    specHot.classList.remove('active');
    gameArea.classList.remove('show');
    gameArea.style.display = 'none';
    nextLevelBtn.classList.remove('show');
    finalCard.classList.remove('show');
    setMsg('', '');
    choicesEl.innerHTML = '';
    chairResult.classList.remove('show');
    chairZone.classList.remove('filled');

    try{ promptSound.pause(); promptSound.currentTime = 0; }catch(e){}

    window.scrollTo({top:0, behavior:'smooth'});
  }

  resetBtn.addEventListener('click', resetGame);

<script>
  function buildDoc(tplId){
    var tpl = document.getElementById(tplId);
    var inner = tpl.innerHTML;
    return '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
      '<style>html,body{margin:0;padding:0;}</style></head><body>' + inner + '</body></html>';
  }

  var frames = {
    1: document.getElementById('frame1'),
    2: document.getElementById('frame2'),
    3: document.getElementById('frame3')
  };
  var loaded = { 1:false, 2:false, 3:false };
  var maxReached = 1;

  function ensureLoaded(n){
    if(!loaded[n]){
      frames[n].srcdoc = buildDoc('tpl' + n);
      loaded[n] = true;
    }
  }

  function resizeFrame(n){
    try{
      var doc = frames[n].contentWindow.document;
      var h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
      frames[n].style.height = (h + 20) + 'px';
    }catch(e){}
  }

  function updateStepbar(n){
    document.querySelectorAll('.step').forEach(function(el){
      var t = parseInt(el.dataset.tab, 10);
      el.classList.toggle('current', t === n);
      el.classList.toggle('done', t < n || (t <= maxReached && t !== n));
    });
  }

  function showTab(n){
    if(n > maxReached) maxReached = n;
    ensureLoaded(n);
    Object.keys(frames).forEach(function(k){
      frames[k].classList.toggle('active', parseInt(k,10) === n);
    });
    updateStepbar(n);
    setTimeout(function(){ resizeFrame(n); }, 350);
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  document.querySelectorAll('.step').forEach(function(el){
    el.addEventListener('click', function(){
      var t = parseInt(el.dataset.tab, 10);
      if(t <= maxReached){ showTab(t); }
    });
  });

  window.addEventListener('message', function(e){
    if(!e.data) return;
    if(e.data.type === 'navigate'){
      showTab(e.data.tab);
    }
    if(e.data.type === 'resetActivity'){
      ensureLoaded(2);
      frames[2].contentWindow.postMessage({ type:'resetActivity' }, '*');
      showTab(2);
    }
  });

  window.addEventListener('load', function(){
    for(var i=1;i<=3;i++){
      (function(n){
        frames[n].addEventListener('load', function(){ resizeFrame(n); });
      })(i);
    }
    showTab(1);
  });
</script>
